  agent {
    package_manager {
      pytorch_resolve: "none"
    }
    extra_docker_arguments: ["--network", "clearml-tutorial_backend"]
    docker_args_filters: ["^--env$", "^-e$"]
  }
  sdk {
    development {
      default_output_uri: "s3://minio:9000/clearml"
    }
    aws {
      s3 {
        credentials: [
          {
            host: "minio:9000"
            key: ${MINIO_AGENT_KEY}
            secret: ${MINIO_AGENT_SECRET}
            secure: false
          }
        ]
      }
    }
  }
