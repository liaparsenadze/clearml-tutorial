include: [docker-compose.yaml]
services:
  minio:
    networks:
      - backend
    command: server --console-address=":9001"
    container_name: clearml-minio
    image: dhi.io/minio:0-debian-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    restart: unless-stopped
    volumes:
      - /opt/clearml/data/minio:/data
    ports:
      - "9001:9001"
      - "9000:9000"
  minio-init:
    networks:
      - backend
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      - minio
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - | 
        until aws s3 ls >/dev/null 2>&1; do echo "waiting for minio"; sleep 2; done
        for bucket in clearml dvc triton; do
        aws s3 mb "s3://$$bucket" 2>/dev/null && echo "created bucket $$bucket" || echo "bucket $$bucket already exists"
        done
        aws s3 ls