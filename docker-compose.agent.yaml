services:
  clearml-agent:
    networks:
      - backend
    container_name: clearml-agent
    image: clearml/clearml-agent-services:latest
    depends_on:
      - apiserver
    restart: unless-stopped
    environment:
      CLEARML_WORKER_ID: clearml-agent
      CLEARML_API_HOST: http://apiserver:8008
      CLEARML_WEB_HOST: http://localhost:8080
      CLEARML_FILES_HOST: http://fileserver:8081
      CLEARML_API_ACCESS_KEY: ${CLEARML_AGENT_ACCESS_KEY}
      CLEARML_API_SECRET_KEY: ${CLEARML_AGENT_SECRET_KEY}
      CLEARML_AGENT_GIT_USER: ${CLEARML_AGENT_GIT_USER}
      CLEARML_AGENT_GIT_PASS: ${CLEARML_AGENT_GIT_PASS}
      MINIO_AGENT_KEY: ${MINIO_AGENT_KEY}
      MINIO_AGENT_SECRET: ${MINIO_AGENT_SECRET}
      CLEARML_AGENT_DOCKER_HOST_MOUNT: "/opt/clearml/agent-default:/root/.clearml"
    volumes:
      - ./deploy-clearml.conf:/root/clearml.conf
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/clearml/agent-default:/root/.clearml
    entrypoint: sh -c "curl --retry 10 --retry-delay 10 --retry-connrefused 'http://apiserver:8008/debug.ping' && clearml-agent daemon --docker --cpu-only --queue default"